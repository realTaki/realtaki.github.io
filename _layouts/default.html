<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.layout != 'home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="https://github.com/{{ site.github_username }}.png">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{%- feed_meta -%}
</head>
<body>

<nav class="topnav">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="https://github.com/{{ site.github_username }}.png" alt="">
    <span>{{ site.title }}</span>
  </a>
  <div class="navlinks">
    <a href="{{ '/' | relative_url }}">🏠 首页</a>
    <a href="{{ '/#posts' | relative_url }}">📝 文章</a>
    <a href="https://github.com/{{ site.github_username }}">🐙 GitHub</a>
  </div>
</nav>

<div class="banner{% if page.layout == 'post' %} slim{% endif %}"></div>

<div class="wrap{% if page.layout == 'post' %} narrow{% endif %}">

  {{ content }}

  <footer>
    © {{ 'now' | date: "%Y" }} {{ site.author }} · Built with ❤️ &amp; hosted on GitHub Pages
  </footer>

</div>

</body>
</html>

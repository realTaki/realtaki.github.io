<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.layout == 'post' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#00AEEC">
<link rel="icon" href="https://github.com/{{ site.github_username }}.png">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{%- feed_meta -%}
</head>
<body>

{% if page.layout == 'post' %}<div class="progress" id="progress"></div>{% endif %}

<nav class="topnav">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="https://github.com/{{ site.github_username }}.png" alt="">
    <span>{{ site.title }}</span>
  </a>
  <div class="navlinks">
    <a href="{{ '/' | relative_url }}">🏠 首页</a>
    <a href="{{ '/#posts' | relative_url }}">📝 文章</a>
    <a href="https://github.com/{{ site.github_username }}">🐙 GitHub</a>
  </div>
</nav>

<div class="banner{% if page.layout == 'post' %} slim{% endif %}"></div>

<div class="wrap{% if page.layout == 'post' %} narrow{% endif %}">

  {{ content }}

  <footer>
    © {{ 'now' | date: "%Y" }} {{ site.author }} · Built with ❤️ &amp; hosted on GitHub Pages
  </footer>

</div>

<button class="totop" id="totop" aria-label="回到顶部">↑</button>

<script>
(function(){
  var bar = document.getElementById('progress');
  var top = document.getElementById('totop');
  function onScroll(){
    var y = window.scrollY || document.documentElement.scrollTop;
    if (bar) {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (y / h) * 100 : 0) + '%';
    }
    top.classList.toggle('show', y > 400);
  }
  top.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>

</body>
</html>
